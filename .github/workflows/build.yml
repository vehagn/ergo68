name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build inside the same devcontainer used for local development (.devcontainer/).
      - name: Build ble_micro_pro:ergo68:uf2 in the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ergo68-ble-micro-pro-firmware
          path: build/*.uf2
          if-no-files-found: error
