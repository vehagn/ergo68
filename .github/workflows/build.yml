name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build inside the same devcontainer used for local development (.devcontainer/).
      - name: Build BLE Micro Pro and Pro Micro firmware in the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: just build

      - uses: actions/upload-artifact@v4
        with:
          name: ergo68-firmware
          path: |
            build/*.uf2
            build/*.hex
          if-no-files-found: error
