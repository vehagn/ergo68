name: BLE Micro Pro diagnostics

# Temporary: builds the fork's stock firmware and this keymap at two fork versions, to find out
# why the stonegarden BLE Micro Pro build doesn't start. See `just bmp-diagnostics`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: scripts/bmp-toolchain-probe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bmp-toolchains
          path: build/bmp-toolchains/
          if-no-files-found: error

  # The official 1.4.0 binary's newlib paths are relative, which points at a distro-packaged
  # toolchain (Debian/Ubuntu's gcc-arm-none-eabi) rather than Arm's or QMK's builds.
  distro-toolchain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:bookworm"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build stock 1.4.0 and stonegarden
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -yq --no-install-recommends git make python3 python3-venv python3-pip \
            ca-certificates curl gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          git config --global --add safe.directory '*'
          python3 -m venv /venv && . /venv/bin/activate
          tag=$(echo "${{ matrix.image }}" | tr ':' '-')
          out="$PWD/build/distro/$tag"; mkdir -p "$out"
          curl -sSfL -o "$out/official_1_4_0.bin" \
            https://raw.githubusercontent.com/sekigon-gonnoc/BLE-Micro-Pro-WebConfigurator/master/public/application/ble_micro_pro_vial_1_4_0.bin
          for ref in be3adb0a11ab751d2cdf35ba26f5b9011d937ec2 4de02c1aeec5a34f0744a97213499441c508d565; do
            d=/src/$ref; mkdir -p $d; git -C $d init -q; git -C $d remote add origin https://github.com/sekigon-gonnoc/vial-qmk.git
            git -C $d fetch -q --depth 1 origin $ref; git -C $d checkout -q FETCH_HEAD
            git -C $d submodule update -q --init --depth 1 lib/printf
          done
          pip install -q -r /src/be3adb0a11ab751d2cdf35ba26f5b9011d937ec2/requirements.txt qmk
          stock=/src/be3adb0a11ab751d2cdf35ba26f5b9011d937ec2
          make -C $stock ble_micro_pro:vial:uf2 GIT_DESCRIBE=bmp-vial-1.4.0-0-gbe3adb0a11 -j$(nproc)
          arm-none-eabi-objcopy -O binary $stock/.build/ble_micro_pro_vial.elf "$out/stock_1_4_0.bin"
          cp $stock/.build/ble_micro_pro_vial.uf2 "$out/stock_1_4_0.uf2"
          ours=/src/4de02c1aeec5a34f0744a97213499441c508d565
          mkdir -p $ours/keyboards/ble_micro_pro/keymaps/stonegarden
          cp -R keyboards/ergo68/. $ours/keyboards/ble_micro_pro/keymaps/stonegarden/
          make -C $ours ble_micro_pro:stonegarden:uf2 GIT_DESCRIBE=stonegarden-$(git rev-parse --short HEAD) -j$(nproc)
          cp $ours/.build/ble_micro_pro_stonegarden.uf2 "$out/ergo68_ble_micro_pro.uf2"
          arm-none-eabi-gcc --version | head -1 > "$out/gcc.txt"
          python3 - "$out" <<'PY'
          import pathlib, sys
          out = pathlib.Path(sys.argv[1])
          o = (out / "official_1_4_0.bin").read_bytes(); b = (out / "stock_1_4_0.bin").read_bytes()
          d = sum(x != y for x, y in zip(b, o)) + abs(len(b) - len(o))
          print(f"official {len(o)} bytes, stock {len(b)} bytes, {d} bytes differ")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmp-distro-${{ strategy.job-index }}
          path: build/distro/
