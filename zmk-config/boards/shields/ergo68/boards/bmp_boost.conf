# One NiMH AAA cell, measured through the BMP Boost's 1:3 divider (see bmp_boost.overlay), so these
# are a third of the cell voltages: 0% at 1.10 V, 100% at 1.30 V, and the half switches itself off
# below 1.05 V to protect the cell (unless it's on USB). A key press wakes it again.
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_NON_LIPO_MIN_MV=367
CONFIG_ZMK_NON_LIPO_MAX_MV=433
CONFIG_ZMK_NON_LIPO_LOW_MV=350

# The module also puts a half to sleep after a minute of looking for a connection it doesn't get
# (the computer or the other half is off); a key press wakes it.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
