# Two NiMH AAA cells in series per half. The battery kit's diode and switch drop about 0.32 V
# before the BMP Boost's BT input (measured: 2.59 V across the cells, 2.27 V at BT), and the module
# reads BT through the board's 1:3 divider, at the pin, so each threshold is (2 x cell - 0.32 V) / 3:
#   1.30 V per cell = 2.28 V at BT = 760 mV: 100%
#   1.10 V per cell = 1.88 V at BT = 627 mV: 0%
#   1.05 V per cell = 1.78 V at BT = 593 mV: the half switches itself off to protect the cells
#                                            (not while it's on USB)
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_NON_LIPO_MIN_MV=627
CONFIG_ZMK_NON_LIPO_MAX_MV=760
CONFIG_ZMK_NON_LIPO_LOW_MV=593

# The module also puts a half to sleep after a minute of looking for a connection it doesn't get
# (the computer or the other half is off); a key press wakes it.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
