# NiMH AAA cells, measured through the BMP Boost's 1:3 divider (see bmp_boost.overlay), so these
# are a third of the battery-input voltages: 0% at 1.10 V and 100% at 1.30 V.
#
# NOT CALIBRATED YET: these assume one cell straight on the BMP Boost's battery input, but the
# Ergo68 has two cells in series per half (about 2.6 V fresh, less the kit's diode and switch), so
# this reports 100% until it's set from a real reading of the BT input. The low-battery cutoff is
# disabled (0) until then, so it can't switch a half off with good cells in it.
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_NON_LIPO_MIN_MV=367
CONFIG_ZMK_NON_LIPO_MAX_MV=433
CONFIG_ZMK_NON_LIPO_LOW_MV=0

# The module also puts a half to sleep after a minute of looking for a connection it doesn't get
# (the computer or the other half is off); a key press wakes it.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
