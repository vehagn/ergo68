# Mouse keys on the NAV layer.
CONFIG_ZMK_POINTING=y

# Go into deep sleep after 10 minutes without a key press; a key press wakes the half up again
# (reconnecting takes a second or two).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Transmit at -4 dBm instead of 0 dBm to save battery: plenty for the other half and a computer
# on the same desk. Go back to 0 (CONFIG_BT_CTLR_TX_PWR_0=y) if the connection drops out.
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# Report the right half's battery level to the computer as well.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
