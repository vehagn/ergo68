# Mouse keys on the NUMPAD layer.
CONFIG_ZMK_POINTING=y

# Go into deep sleep after 15 minutes without a key press; a key press wakes the half up again.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Report the right half's battery level to the computer as well.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
